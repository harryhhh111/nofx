services:
  # Backend service (API and core logic)
  nofx-v2:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    image: nofx-backend-v2:local
    container_name: nofx-trading-v2
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${NOFX_BACKEND_PORT:-8091}:8080"
      - "${NOFX_PPROF_PORT:-6091}:6060"
    volumes:
      - ./data-v2:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      # Database Configuration
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-nofx_v2}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    networks:
      nofx-v2-network:
        aliases:
          - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend-v2:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    image: nofx-frontend-v2:local
    container_name: nofx-frontend-v2
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3011}:80"
    networks:
      - nofx-v2-network
    depends_on:
      - nofx-v2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-v2-network:
    driver: bridge
